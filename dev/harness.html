<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Pet cards harness</title>
<!--
  Visual harness for the pet cards. Serve the repo root over HTTP (python3 -m http.server)
  and open /dev/harness.html. Needs dev/fixture.json (recorded from a real Home Assistant,
  git-ignored) and a built dist/brinstar-cards.js.
  Query: ?theme=light|dark  &w=<card width px>  &only=feeder|fountain|litter|rooms|pets|weather|energy|security|lights|climate|vacuum|credit-cards
  The Home cards (rooms, pets, weather, energy) also need dev/fixture-home.json, written by the
  workspace's recorder with that house's card configs; it is merged over fixture.json.
-->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary-background-color: #14120f; --ha-card-background: #1e1b17; --card-background-color: #1e1b17;
    --ha-card-border-color: #2e2a24; --ha-card-box-shadow: none; --divider-color: #2e2a24;
    --primary-text-color: #f1ece3; --secondary-text-color: #ada394; --primary-color: #f4b650;
    --text-primary-color: #1e1b17; --state-fan-on-color: #5fc3cf; --success-color: #8cc59a;
    --warning-color: #f4b650; --error-color: #f07a5f; --ha-card-border-radius: 24px;
  }
  :root[data-theme="light"] {
    --primary-background-color: #f4efe6; --ha-card-background: #fffcf7; --card-background-color: #fffcf7;
    --ha-card-border-color: #e6ddce; --ha-card-box-shadow: 0 1px 2px rgba(51,36,17,.05), 0 6px 16px rgba(51,36,17,.05);
    --divider-color: #e2d9ca; --primary-text-color: #221c15; --secondary-text-color: #62584c; --primary-color: #9e5d0a;
    --text-primary-color: #fffcf7; --state-fan-on-color: #167c88; --state-light-on-color: #c47a12; --success-color: #3d7a4e;
    --warning-color: #c47a12; --error-color: #c2412a;
  }
  body { margin: 0; padding: 16px; background: var(--primary-background-color); color: var(--primary-text-color);
         font-family: Montserrat, Roboto, sans-serif; }
  h2 { font-size: 0.9rem; font-weight: 600; color: var(--secondary-text-color); margin: 8px 0; }
  .grid { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin-bottom: 24px; }
  .cell { width: var(--w, 360px); }
  .cell > small { display: block; margin: 0 0 6px 4px; color: var(--secondary-text-color); font-size: 0.75rem; }
  #log { position: fixed; right: 8px; bottom: 8px; max-width: 420px; font: 11px monospace; color: var(--secondary-text-color); }
</style>
</head>
<body>
<div id="app"></div>
<div id="log"></div>
<script type="module">
  import * as mdi from "https://cdn.jsdelivr.net/npm/@mdi/js@7.4.47/mdi.js";

  const q = new URLSearchParams(location.search);
  document.documentElement.dataset.theme = q.get("theme") ?? "dark";
  if (q.get("w")) document.documentElement.style.setProperty("--w", `${q.get("w")}px`);

  // Stand-ins for the HA elements the cards use.
  customElements.define("ha-card", class extends HTMLElement {
    constructor() {
      super();
      this.attachShadow({ mode: "open" }).innerHTML = `<style>:host{display:block;background:var(--ha-card-background);
        border:1px solid var(--ha-card-border-color);border-radius:var(--ha-card-border-radius);
        box-shadow:var(--ha-card-box-shadow);color:var(--primary-text-color)}</style><slot></slot>`;
    }
  });
  customElements.define("ha-alert", class extends HTMLElement {
    constructor() { super(); this.attachShadow({ mode: "open" }).innerHTML = `<div style="padding:12px;border-radius:12px;background:#f07a5f33"><slot></slot></div>`; }
  });
  // Like HA's ha-icon, draw into a shadow root: light-DOM children added during Lit's template
  // cloning would shift Lit's part indexes.
  customElements.define("ha-icon", class extends HTMLElement {
    static observedAttributes = ["icon"];
    constructor() { super(); this.attachShadow({ mode: "open" }); }
    connectedCallback() { this.paint(); }
    attributeChangedCallback() { this.paint(); }
    paint() {
      const name = (this.getAttribute("icon") ?? "").replace("mdi:", "");
      const key = "mdi" + name.split("-").filter(Boolean).map((s) => s[0].toUpperCase() + s.slice(1)).join("");
      this.shadowRoot.innerHTML = `<style>:host{display:inline-flex}</style><svg viewBox="0 0 24 24" style="width:var(--mdc-icon-size,24px);height:var(--mdc-icon-size,24px);fill:currentColor"><path d="${mdi[key] ?? ""}"/></svg>`;
    }
  });

  await import(`../dist/brinstar-cards.js?${Date.now()}`);
  const fx = await (await fetch("./fixture.json", { cache: "no-store" })).json();
  const home = await fetch("./fixture-home.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  if (home) {
    const byId = Object.fromEntries(fx.states.map((s) => [s.entity_id, s]));
    for (const s of home.states) byId[s.entity_id] = s;
    fx.states = Object.values(byId);
    fx.entities = { ...fx.entities, ...home.entities };
    fx.replies = { ...fx.replies, ...home.replies };
  }
  const log = (m) => { const el = document.getElementById("log"); el.textContent = `${new Date().toLocaleTimeString()} ${m}\n` + el.textContent.slice(0, 600); };
  // Cards navigate with pushState; log it instead of leaving the harness.
  history.pushState = (_s, _t, url) => log(`navigate ${url}`);

  function hassWith(mutate, extraReplies = {}) {
    const states = Object.fromEntries(fx.states.map((s) => [s.entity_id, structuredClone(s)]));
    const set = (id, state, attrs) => { if (states[id]) { states[id].state = state; Object.assign(states[id].attributes, attrs ?? {}); states[id].last_changed = new Date().toISOString(); } };
    mutate?.(set, states);
    return {
      states,
      entities: fx.entities,
      locale: { language: "en-US" },
      config: { currency: "USD" },
      formatEntityState: (e) => e.state,
      hassUrl: (p) => p,
      callService: async (d, s, data) => log(`${d}.${s} ${JSON.stringify(data)}`),
      callWS: async (msg) => {
        if (msg.type === "call_service") return fx.replies[`forecast|${msg.target?.entity_id}|${msg.service_data?.type}`] ?? {};
        const ids = (msg.entity_ids ?? msg.statistic_ids ?? []).slice().sort().join(",");
        const key = `${msg.type.startsWith("history") ? "history" : "statistics"}|${ids}`;
        return extraReplies[key] ?? fx.replies[key] ?? {};
      },
    };
  }

  const daysAgo = (n) => new Date(Date.now() - n * 86400000).toISOString();
  // Device stems come from the fixture, so the harness works with any recorded house.
  const ids = fx.states.map((s) => s.entity_id);
  const stem = (re) => (ids.map((id) => id.match(re)).find(Boolean) ?? [])[1];
  const F = stem(/^sensor\.(.+)_last_fed$/);
  const feeder = (extra) => (set) => { set(`button.${F}_reset_food_level_refilled`, daysAgo(3)); extra?.(set); };
  const W = stem(/^sensor\.(.+)_water_weight$/);
  const L = stem(/^vacuum\.(.+)_litter_box$/);
  const laser = Object.values(fx.entities).find((e) => e.translation_key === "laser_dirty")?.entity_id;
  const offline = (prefix) => (set, states) => { for (const id of Object.keys(states)) if (id.split(".")[1].startsWith(prefix)) set(id, "unavailable"); };

  const SUITES = {
    feeder: {
      config: { type: "custom:brinstar-feeder-card", entity: `sensor.${F}_last_fed`, name: "Feeder 1", hopper_grams: 1300, grams_per_scoop: 10 },
      cases: {
        "live (never refilled)": null,
        "refilled 3 days ago": feeder(),
        low: feeder((set) => set(`binary_sensor.${F}_food_low`, "on")),
        empty: feeder((set) => { set(`binary_sensor.${F}_food_low`, "on"); set(`binary_sensor.${F}_food_empty`, "on"); }),
        jammed: feeder((set) => set(`binary_sensor.${F}_jammed`, "on")),
        offline: offline(F),
        settings: feeder(),
      },
    },
    fountain: {
      config: { type: "custom:brinstar-fountain-card", entity: `sensor.${W}_water_weight`, name: "Fountain", capacity_grams: 3000 },
      cases: {
        live: null,
        "full, flowing": (set) => { set(`sensor.${W}_water_weight`, "2650"); set(`binary_sensor.${W}_water_low`, "off"); set(`binary_sensor.${W}_pump_running`, "on"); },
        "needs water": (set) => { set(`sensor.${W}_water_weight`, "1180"); set(`binary_sensor.${W}_water_empty`, "on"); set(`binary_sensor.${W}_water_low`, "on"); set(`binary_sensor.${W}_pump_running`, "off"); },
        "on battery, waiting": (set) => { set(`binary_sensor.${W}_power_adapter`, "off"); set(`sensor.${W}_battery`, "64"); set(`binary_sensor.${W}_pump_running`, "off"); },
        "dry-run off, filter due": (set) => { set(`switch.${W}_dry_run_protection`, "off"); set(`binary_sensor.${W}_filter_due`, "on"); },
        offline: offline(W),
        settings: null,
      },
    },
    litter: {
      config: {
        type: "custom:brinstar-litter-card", entity: `vacuum.${L}_litter_box`, name: "Litter box",
        last_cycle: ids.find((id) => id.startsWith("input_datetime.") && id.includes("last_cycle")),
        cats: [{ name: "Cat A", max_lb: 9 }, { name: "Cat B", max_lb: 12.5 }, { name: "Cat C" }],
      },
      cases: {
        live: null,
        cycling: (set) => { set(`vacuum.${L}_litter_box`, "cleaning"); set(`sensor.${L}_status_code`, "ccp"); },
        "drawer full": (set) => { set(`sensor.${L}_waste_drawer`, "86"); set(`sensor.${L}_status_code`, "dfs"); },
        "fault, laser dirty": (set) => { set(`sensor.${L}_status_code`, "csf"); set(laser, "on"); },
        offline: offline(L),
        settings: null,
      },
    },
  };

  // Home cards: configs come from the recording (this house's rooms and sensors).
  if (home?.configs) {
    const C = home.configs;
    const room = (name) => C.rooms.find((r) => r.name === name) ?? C.rooms[0];
    const seen = (cams, objs) => (set) => cams.forEach((c) => objs.forEach((o) => set(`binary_sensor.${c}_${o}_occupancy`, "on")));
    const firstWith = (key) => C.rooms.find((r) => r[key]);
    const air = firstWith("pm25") ?? firstWith("voc");
    const lit = C.rooms.find((r) => r.frigate && r.light) ?? C.rooms[0];
    SUITES.rooms = {
      w: 180,
      cases: {
        ...Object.fromEntries(C.rooms.map((r) => [r.name, { config: r }])),
        "person and cat seen": { config: lit, mutate: seen(lit.frigate ?? [], ["person", "cat"]) },
        "person seen": { config: lit, mutate: seen((lit.frigate ?? []).slice(0, 1), ["person"]) },
        "poor air": { config: air, mutate: (set) => { if (air.pm25) set(air.pm25, "41"); if (air.voc) set(air.voc, "280"); } },
        "light off": { config: lit, mutate: (set) => (lit.lights ?? [lit.light]).forEach((id) => set(id, "off")) },
        "light offline": { config: lit, mutate: (set) => set(lit.light, "unavailable") },
        "no sensors": { config: { type: "custom:brinstar-room-card", name: "Closet", icon: "mdi:hanger", light: lit.light } },
      },
    };
    const P = C.pets;
    const F0 = P.feeders?.[0]?.entity.replace(/^sensor\.(.+)_last_fed$/, "$1");
    const Wt = P.fountain?.replace(/^sensor\.(.+)_water_weight$/, "$1");
    const Lb = P.litter?.replace(/^vacuum\.(.+)_litter_box$/, "$1");
    SUITES.pets = {
      config: P,
      cases: {
        live: null,
        "all fine": (set) => { set(`sensor.${Lb}_waste_drawer`, "30"); set(`sensor.${Lb}_status_code`, "rdy"); set(`sensor.${Wt}_water_weight`, "2600"); },
        "drawer full, feeder jammed": (set) => { set(`sensor.${Lb}_waste_drawer`, "88"); set(`sensor.${Lb}_status_code`, "dfs"); set(`binary_sensor.${F0}_jammed`, "on"); },
        "fountain empty": (set) => { set(`sensor.${Wt}_water_weight`, "1150"); set(`binary_sensor.${Wt}_water_empty`, "on"); set(`binary_sensor.${Wt}_water_low`, "on"); set(`binary_sensor.${Wt}_pump_running`, "off"); },
        "litter box offline": (set) => set(P.litter, "unavailable"),
      },
    };
    const stationStem = C.weather.entity.replace(/_[^_]+$/, "");
    const S = (k) => `${stationStem}_${k}`;
    SUITES.weather = {
      config: C.weather,
      cases: {
        live: null,
        storm: (set) => {
          set(C.weather.weather, "lightning-rainy");
          [["dailyrain", "2.14"], ["weeklyrain", "3.02"], ["windspeed", "28"], ["windgust", "46"], ["maxdailygust", "52"], ["winddir", "210"], ["humidity", "96"], ["baromrel", "29.31"]].forEach(([k, v]) => set(S(k), v));
        },
      },
    };
    const E = C.energy;
    SUITES.energy = {
      config: E,
      cases: {
        live: null,
        "heavy load": (set) => {
          set(E.power, "11800"); set(E.current, "98.4"); set(E.legs[0].current, "52.1"); set(E.legs[1].current, "46.3");
          const c = Object.fromEntries(E.circuits.map((x) => [x.name, x.power]));
          set(c.AC, "4200"); set(c.Dryer, "5200"); set(c.Range, "1800");
        },
        "one leg loaded": (set) => { set(E.legs[0].current, "131"); set(E.legs[1].current, "18"); },
      },
    };
    const Lc = C.lights;
    if (Lc) {
      const ids = Lc.lights.map((l) => l.entity);
      const on = (list, pct) => (set) => list.forEach((id) => set(id, "on", pct && id.startsWith("light.") ? { brightness: Math.round(pct * 2.55) } : {}));
      const off = (set) => [...ids, ...(Lc.all_off_extra ?? [])].forEach((id) => set(id, "off"));
      SUITES.lights = {
        config: Lc,
        cases: {
          live: null,
          "all off": off,
          "one dimmer at 30%": (set, states) => {
            off(set);
            const dim = ids.find((id) => (states[id]?.attributes.supported_color_modes ?? []).some((m) => m !== "onoff"));
            on([dim], 30)(set);
          },
          "evening, many on": (set) => { off(set); on(ids.slice(0, 9), 70)(set); },
        },
      };
    }
    const Cl = C.climate;
    if (Cl) {
      const T = Cl.entity, F = Cl.fans ?? [], P = Cl.power ?? [];
      // A made-up day: cooling through the afternoon, the target lowered from 75 to 73 this morning.
      const day = () => {
        const now = Date.now() / 1000, rows = [];
        for (let i = 0; i <= 48; i++) {
          const t = now - 86400 + i * 1800, h = new Date(t * 1000).getHours();
          rows.push({ s: "cool", lu: t, a: { current_temperature: Math.round(73 + 2.5 * Math.sin((i / 48) * 2 * Math.PI)), temperature: i < 30 ? 75 : 73, hvac_action: h >= 13 && h < 17 ? "cooling" : "idle" } });
        }
        return { [`history|${T}`]: { [T]: rows } };
      };
      const cooling = (set) => { set(T, "cool", { hvac_action: "cooling", temperature: 73, current_temperature: 76 }); set(P[0], "2350"); };
      SUITES.climate = {
        config: Cl,
        cases: {
          live: null,
          cooling,
          heating: (set) => { set(T, "heat", { hvac_action: "heating", temperature: 68, current_temperature: 65 }); set(P[1], "1180"); },
          "heat/cool, idle": (set) => set(T, "heat_cool", { hvac_action: "idle", temperature: null, target_temp_low: 68, target_temp_high: 76 }),
          off: (set) => set(T, "off", { hvac_action: "off" }),
          "thermostat offline": (set) => set(T, "unavailable"),
          "fans mixed": (set) => {
            set(F[0].entity, "off", { percentage: 0 }); set(F[1].entity, "on", { percentage: 33 });
            set(F[2].entity, "on", { percentage: 66 }); set(F[3].entity, "unavailable");
          },
          "expanded, cooled today": { config: { ...Cl, expanded: true }, replies: day(), mutate: (set) => { cooling(set); set(T, "cool", { fan_mode: "on", preset_mode: "eco" }); } },
          "expanded, recorded day": { config: { ...Cl, expanded: true } },
        },
      };
    }
    const Sc = C.security;
    if (Sc) {
      const L = Sc.locks ?? [], G = Sc.covers ?? [], K = Sc.contacts ?? [];
      SUITES.security = {
        config: Sc,
        cases: {
          live: null,
          "front door unlocked": (set) => set(L[0].entity, "unlocked"),
          "garage open": (set) => set(G[0].entity, "open"),
          "armed away": (set) => set(Sc.alarm, "armed_away"),
          triggered: (set) => { set(Sc.alarm, "triggered"); set(L[0].entity, "unlocked"); },
          "lock jammed, other locking": (set) => { set(L[L.length - 1].entity, "jammed"); set(L[0].entity, "locking"); },
          "garage offline (fallback)": (set) => set(G[0].entity, "unavailable"),
          "two windows open": (set) => K.slice(-2).forEach((k) => set(k.entity, "on")),
          "four open": (set) => K.slice(0, 4).forEach((k) => set(k.entity, "on")),
        },
      };
    }
    const Vc = C.vacuum;
    if (Vc) {
      const V = Vc.entity, dev = fx.entities[V]?.device_id;
      const sib = (key) => Object.values(fx.entities).find((e) => e.device_id === dev && e.translation_key === key
        && e.entity_id.startsWith("sensor.") && !/_room_\d+_/.test(e.entity_id))?.entity_id;
      const run = (state, room, pct, attrs) => (set) => {
        set(V, state, { charging: false, battery: 86, ...attrs });
        set(sib("current_room"), room); set(sib("cleaning_progress"), String(pct));
        set(sib("cleaning_time"), "12"); set(sib("cleaned_area"), "9");
      };
      SUITES.vacuum = {
        config: Vc,
        cases: {
          live: null,
          "cleaning, 45%": run("cleaning", "Living Room", 45),
          paused: run("paused", "Kitchen", 60),
          "heading home": run("returning", "Kitchen", 100, { battery: 31 }),
          "stopped off the dock": (set) => set(V, "idle", { charging: false, battery: 54 }),
          "wheel stuck": run("error", "Hallway", 30, { has_error: true, error: "Wheel stuck", battery: 40 }),
          offline: (set) => set(V, "unavailable"),
          "dirty water tank": (set) => set(sib("dirty_water_tank_status"), "not_installed_or_full"),
          "parts low": (set) => { set(sib("sensor_dirty_left"), "15"); set(sib("wheel_dirty_left"), "12"); },
          "part due, battery low": (set) => { set(sib("sensor_dirty_left"), "6"); set(sib("wheel_dirty_left"), "12"); set(V, "docked", { battery: 14, charging: true }); },
          "weekdays-only schedule": (set, states) => set(V, "docked", { schedule: states[V].attributes.schedule.map((t) => ({ ...t, repeats: "0111110" })) }),
        },
      };
    }
  }

  // Credit cards: made-up cards with due dates relative to today (credit_cards integration sensors).
  {
    const iso = (n) => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("en-CA"); };
    const ccIds = Array.from({ length: 6 }, (_, i) => `sensor.credit_card_${i + 1}`);
    for (const id of ccIds) fx.entities[id] = { entity_id: id, platform: "credit_cards" };
    const cc = (rows) => (_set, states) => rows.forEach(([name, status, days, extra], i) => {
      states[ccIds[i]] = {
        entity_id: ccIds[i], state: iso(days), last_updated: "",
        attributes: { friendly_name: name, card_id: `c${i + 1}`, status, days_until: days, due_day: Number(iso(days).slice(8)),
          autopay: status === "autopay", amount_due: null, payment_url: null, paid_on: null, device_class: "date", ...extra },
      };
    });
    const link = "https://pay.example.com";
    SUITES["credit-cards"] = {
      config: { type: "custom:brinstar-credit-cards-card" },
      cases: {
        mixed: cc([
          ["Acme Visa", "overdue", -5, { amount_due: 120.5, payment_url: link }],
          ["Northwind Store Card", "due_today", 0, { amount_due: 45 }],
          ["Contoso Rewards", "due_soon", 2, { payment_url: link }],
          ["Fabrikam Card", "upcoming", 20, {}],
          ["Tailspin Visa", "paid", 30, { paid_on: iso(0) }],
          ["Woodgrove Card", "autopay", 6, {}],
        ]),
        "one overdue": cc([["Acme Visa", "overdue", -1, { amount_due: 1234.5 }], ["Northwind Store Card", "upcoming", 12, {}]]),
        "all paid": cc([
          ["Acme Visa", "paid", 25, { paid_on: iso(-3) }],
          ["Northwind Store Card", "paid", 31, { paid_on: iso(0) }],
          ["Woodgrove Card", "autopay", 4, {}],
        ]),
        "autopay only": cc([["Woodgrove Card", "autopay", 4, {}], ["Tailspin Visa", "autopay", 18, {}]]),
        empty: null,
        "long names": cc([
          ["Northwind Traders Platinum Rewards Visa Signature", "due_soon", 3, { amount_due: 12345.67, payment_url: link }],
          ["Contoso Home Improvement Store Credit Card", "upcoming", 9, { amount_due: 89.99 }],
        ]),
        // Synced from the bank: one synced, one tapped Paid and waiting on the bank, one needing a re-link.
        "bank linked": cc([
          ["Fabrikam Card", "due_soon", 3, { amount_due: 75, bank: "Fabrikam Federal Credit Union", bank_status: "relink" }],
          ["Acme Visa", "upcoming", 18, { amount_due: 482.17, payment_url: link, bank: "Northwind Bank", bank_status: "ok" }],
          ["Contoso Rewards", "paid", 29, { paid_on: iso(0), bank: "Contoso Bank", bank_status: "ok", awaiting_bank: true }],
          ["Woodgrove Card", "upcoming", 9, { amount_due: 40 }],
        ]),
      },
    };
  }

  const app = document.getElementById("app");
  for (const [suite, { config, cases, w }] of Object.entries(SUITES)) {
    if (q.get("only") && q.get("only") !== suite) continue;
    app.insertAdjacentHTML("beforeend", `<h2>${suite}</h2><div class="grid" id="g-${suite}"></div>`);
    for (const [label, spec] of Object.entries(cases)) {
      const { config: cfg = config, mutate, replies } = spec && typeof spec === "object" ? spec : { mutate: spec };
      const cell = document.createElement("div");
      cell.className = "cell";
      if (w && !q.get("w")) cell.style.width = `${w}px`;
      cell.innerHTML = `<small>${label}</small>`;
      const card = document.createElement(cfg.type.replace("custom:", ""));
      card.setConfig(cfg);
      card.hass = hassWith(mutate, replies);
      cell.append(card);
      document.getElementById(`g-${suite}`).append(cell);
      if (label === "settings") card.updateComplete.then(() => { card.settings = true; });
    }
  }
</script>
</body>
</html>
